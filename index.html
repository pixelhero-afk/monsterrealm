    <script>
      // Suppress benign Vite HMR websocket reconnection rejection in AI Studio preview sandbox
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('WebSocket closed') !== -1 || msg.indexOf('failed to connect to websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
